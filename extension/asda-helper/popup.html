<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weekwise Asda Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header>
        <p>Weekwise</p>
        <h1>Asda Helper</h1>
      </header>
      <section id="status" class="status-panel">Open Weekwise Shopping and send a list to the helper.</section>
      <section id="current" class="current-panel"></section>
      <section class="action-row one">
        <button id="import-weekwise" type="button">Import from Weekwise</button>
      </section>
      <section class="action-row one">
        <button id="auto-add-saved" type="button">Auto-add saved products</button>
      </section>
      <section class="action-row one">
        <a class="basket-link" href="https://www.asda.com/groceries/trolley" target="_blank" rel="noreferrer">Review Asda basket</a>
      </section>
      <section class="action-row one">
        <button id="verify-basket" type="button">Open basket verifier</button>
      </section>
      <section class="action-row">
        <button id="open-current" type="button">Open current</button>
        <button id="open-next" type="button">Open next</button>
      </section>
      <section class="action-row">
        <button id="mark-added" type="button">Added + next</button>
        <button id="mark-unavailable" type="button">Unavailable + next</button>
      </section>
      <section id="auto-add-review" class="review-list"></section>
      <section id="queue" class="queue-list"></section>
      <footer>
        <button id="clear-run" type="button">Reset run</button>
      </footer>
    </main>
    <script src="build/popup.js"></script>
  </body>
</html>
